<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="livadent-logo-title livadent-logo-desc">
  <title id="livadent-logo-title">Özel livaDENT Ağız ve Diş Sağlığı Poliklinikleri Logosu</title>
  <desc id="livadent-logo-desc">Obsidiyen siyah, zümrüt yeşili ve platin gümüş tonlarında sonsuzluk kurdeleli lüks diş amblemi ve livaDENT yazısı.</desc>
  <defs>
    <radialGradient id="obsidianGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#112922" />
      <stop offset="58%" stop-color="#0A1310" />
      <stop offset="100%" stop-color="#040706" />
    </radialGradient>
    <linearGradient id="platinumBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#CBD5E1" />
      <stop offset="55%" stop-color="#64748B" />
      <stop offset="82%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="emeraldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="platinumTooth" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="ambientEmerald" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="whiteToEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="44%" stop-color="#F1F5F9" />
      <stop offset="74%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer Luxury Obsidian Shield -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#obsidianGlow)" stroke="url(#platinumBezel)" stroke-width="2.4" />
  <rect x="9.5" y="9.5" width="101" height="101" rx="23" fill="none" stroke="url(#emeraldRibbon)" stroke-opacity="0.45" stroke-width="1.1" />

  <!-- Soft Emerald Aura -->
  <circle cx="60" cy="50" r="36" fill="url(#ambientEmerald)" />

  <!-- Top Metallic Diamond Accent -->
  <polygon points="60,15.5 63.5,19 60,22.5 56.5,19" fill="url(#emeraldRibbon)" />

  <!-- Stylized Infinity-Crown Tooth Mark -->
  <path
    d="M36.5 41.5
       C31.5 47.5, 34 61.5, 38.8 70.5
       C41.8 76.2, 44.6 80.5, 47.6 80.5
       C50.4 80.5, 52.8 71.2, 56.2 66.8
       C57.9 64.6, 59.1 64.1, 60 64.1
       C60.9 64.1, 62.1 64.6, 63.8 66.8
       C67.2 71.2, 69.6 80.5, 72.4 80.5
       C75.4 80.5, 78.2 76.2, 81.2 70.5
       C86 61.5, 88.5 47.5, 83.5 41.5"
    fill="none"
    stroke="url(#platinumTooth)"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Signature Flowing Infinity Crest Forming Tooth Upper Contour -->
  <path
    d="M36.5 41.5
       C34.2 35.8, 39.2 29.2, 47.2 29.2
       C54.6 29.2, 59.8 34.4, 65.8 39.8
       C71.4 44.8, 78.8 46.8, 83.5 41.5
       C86.6 37.8, 85.4 30.8, 78.8 29.6
       C72.2 28.4, 66.5 34.4, 60.4 39.6
       C54.8 44.4, 47.2 46.2, 40.8 44.2"
    fill="none"
    stroke="url(#emeraldRibbon)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Specular Highlight Line Inside Tooth -->
  <path
    d="M42.8 54.5 C44.2 62.5, 45.8 67.5, 47.6 71.2"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.65"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Delicate Divider Hairline -->
  <line x1="28" y1="88.5" x2="92" y2="88.5" stroke="url(#platinumBezel)" stroke-opacity="0.38" stroke-width="0.9" />

  <!-- Bold Luxury Brand Signature -->
  <text
    x="60"
    y="102"
    text-anchor="middle"
    fill="url(#whiteToEmerald)"
    font-family="'Plus Jakarta Sans', 'Montserrat', 'Segoe UI', Arial, sans-serif"
    font-size="13.2"
    font-style="normal"
    font-weight="800"
    letter-spacing="1.2"
  >livaDENT</text>
</svg>
